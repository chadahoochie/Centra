name: centra-dockerstack

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: centra
      POSTGRES_USER: centra
      POSTGRES_PASSWORD: centra_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centra -d centra"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Centra_Password123!"

  control-plane:
    build:
      context: ../..
      dockerfile: src/Centra.ControlPlane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - sqlserver
      - otel-collector

  node-1:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    hostname: node-1
    ports:
      - "8081:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      ConnectionStrings__sqlserver: "Server=sqlserver,1433;Database=centra;User Id=sa;Password=Centra_Password123!;TrustServerCertificate=True"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - sqlserver
      - control-plane
      - otel-collector

  node-2:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    hostname: node-2
    ports:
      - "8082:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      ConnectionStrings__sqlserver: "Server=sqlserver,1433;Database=centra;User Id=sa;Password=Centra_Password123!;TrustServerCertificate=True"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - sqlserver
      - control-plane
      - otel-collector

  node-3:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    hostname: node-3
    ports:
      - "8083:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      ConnectionStrings__sqlserver: "Server=sqlserver,1433;Database=centra;User Id=sa;Password=Centra_Password123!;TrustServerCertificate=True"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - sqlserver
      - control-plane
      - otel-collector

  simulator:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack.Simulator/Dockerfile
    environment:
      Simulation__NodeBaseUrls: http://node-1:8080,http://node-2:8080,http://node-3:8080
      Simulation__IntervalMs: "1500"
      Simulation__ActorPoolSize: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - node-1
      - node-2
      - node-3

  # --- Observability stack: showcases Centra's baked-in ActivitySource/Meter telemetry ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./otel/loki.yaml:/etc/loki/loki.yaml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./otel/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
