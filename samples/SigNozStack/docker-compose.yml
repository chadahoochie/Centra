name: centra-signoz-stack

services:
  # --- Physical Infrastructure Drivers ---
  redis:
    image: redis:7-alpine
    container_name: centra-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: centra-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:17-alpine
    container_name: centra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: centra
      POSTGRES_USER: centra
      POSTGRES_PASSWORD: centra_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centra -d centra"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Centra Cluster: Control Plane & 3 Node Replicas ---
  control-plane:
    build:
      context: ../..
      dockerfile: src/Centra.ControlPlane/Dockerfile
    container_name: centra-control-plane
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - signoz-otel-collector

  node-1:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    container_name: centra-node-1
    hostname: node-1
    ports:
      - "8081:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - control-plane
      - signoz-otel-collector

  node-2:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    container_name: centra-node-2
    hostname: node-2
    ports:
      - "8082:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - control-plane
      - signoz-otel-collector

  node-3:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack/Dockerfile
    container_name: centra-node-3
    hostname: node-3
    ports:
      - "8083:8080"
    environment:
      Centra__ControlPlaneEndpoint: http://control-plane:8080
      ConnectionStrings__redis: redis:6379
      RabbitMQ__HostName: rabbitmq
      ConnectionStrings__postgresql: "Host=postgres;Database=centra;Username=centra;Password=centra_password"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4317
    depends_on:
      - redis
      - rabbitmq
      - postgres
      - control-plane
      - signoz-otel-collector

  simulator:
    build:
      context: ../..
      dockerfile: samples/Centra.Sample.DockerStack.Simulator/Dockerfile
    container_name: centra-simulator
    environment:
      Simulation__NodeBaseUrls: http://node-1:8080,http://node-2:8080,http://node-3:8080
      Simulation__IntervalMs: "1500"
      Simulation__ActorPoolSize: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector:4317
    depends_on:
      - node-1
      - node-2
      - node-3

  # --- SigNoz Observability Engine: Traces, Metrics, Logs, Dashboards ---
  zookeeper-1:
    image: zookeeper:3.8
    container_name: signoz-zookeeper-1
    hostname: zookeeper-1
    ports:
      - "2181:2181"
    environment:
      - ZOO_MY_ID=1
      - ZOO_PORT=2181
      - ZOO_4LW_COMMANDS_WHITELIST=*

  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    hostname: clickhouse
    tty: true
    restart: on-failure
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - ./signoz/clickhouse-config.xml:/etc/clickhouse-server/config.xml
      - ./signoz/clickhouse-users.xml:/etc/clickhouse-server/users.xml
      - ./signoz/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./signoz/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./signoz/user_scripts:/var/lib/clickhouse/user_scripts/
    depends_on:
      - zookeeper-1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector-migrator:
    image: signoz/signoz-schema-migrator:0.102.0
    container_name: signoz-otel-migrator
    command:
      - "--dsn=tcp://clickhouse:9000"
    depends_on:
      clickhouse:
        condition: service_healthy

  query-service:
    image: signoz/query-service:0.48.0
    container_name: signoz-query-service
    command:
      - "-config=/root/config/prometheus.yml"
    volumes:
      - ./signoz/prometheus.yml:/root/config/prometheus.yml
      - ./signoz/dashboards:/root/config/dashboards
      - signoz-db-data:/var/lib/signoz
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - ALERTMANAGER_API_PREFIX=http://alertmanager:9093/api/
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator:
        condition: service_completed_successfully

  alertmanager:
    image: signoz/alertmanager:0.23.5
    container_name: signoz-alertmanager
    restart: on-failure
    command:
      - --queryService.url=http://query-service:8085
      - --storage.path=/data
    volumes:
      - signoz-alert-data:/data
    depends_on:
      query-service:
        condition: service_healthy

  frontend:
    image: signoz/frontend:0.48.0
    container_name: signoz-frontend
    restart: on-failure
    ports:
      - "3301:3301"
    volumes:
      - ./signoz/nginx-config.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - alertmanager
      - query-service

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.0
    container_name: signoz-otel-collector
    command:
      - "--config=/etc/otel-collector-config.yaml"
      - "--manager-config=/etc/manager-config.yaml"
      - "--copy-path=/var/tmp/collector-config.yaml"
      - "--feature-gates=-pkg.translator.prometheus.NormalizeName"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector-migrator:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy

volumes:
  signoz-db-data:
  signoz-alert-data:
