name: Publish NuGet Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to pack and publish (e.g., 1.0.0 or 1.0.0-preview.1). Defaults to release tag if omitted.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Calculate Package Version
        id: versioning
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="${{ github.ref_name }}"
          fi

          # Strip leading 'v' if present (e.g., v1.0.0 -> 1.0.0)
          VERSION="${RAW_VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine package version!"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Calculated package version: ${VERSION}"

      - name: Restore Dependencies
        run: dotnet restore Centra.slnx

      - name: Build Solution
        run: dotnet build Centra.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Centra.slnx --configuration Release --no-build --verbosity normal --filter "Category!=Integration"

      - name: Pack NuGet Packages
        run: >
          dotnet pack Centra.slnx
          --configuration Release
          --no-build
          /p:PackageVersion="${{ steps.versioning.outputs.VERSION }}"
          --output ./nupkgs

      - name: Verify Expected Packages
        run: |
          REQUIRED_PACKAGES=(
            "Centra.Abstractions"
            "Centra.Actors.Abstractions"
            "Centra.Actors"
            "Centra.Bindings.Abstractions"
            "Centra.Bindings"
            "Centra.Components.Abstractions"
            "Centra.Events.Abstractions"
            "Centra.Events"
            "Centra.Hosting"
            "Centra.Invocation.Abstractions"
            "Centra.Invocation"
            "Centra.Locks.Abstractions"
            "Centra.Locks"
            "Centra.PubSub.Abstractions"
            "Centra.PubSub"
            "Centra.Resilience.Abstractions"
            "Centra.Resilience"
            "Centra.Runtime"
            "Centra.Serialization"
            "Centra.State.Abstractions"
            "Centra.State"
            "Centra.Sync.Abstractions"
            "Centra.Sync"
            "Centra.Workflows.Abstractions"
            "Centra.Workflows"
            "Centra.Providers.Redis"
            "Centra.Providers.Redis.Hosting"
            "Centra.Providers.RabbitMQ"
            "Centra.Providers.RabbitMQ.Hosting"
            "Centra.Providers.PostgreSql"
            "Centra.Providers.PostgreSql.Hosting"
            "Centra.Providers.SqlServer"
            "Centra.Providers.SqlServer.Hosting"
            "Centra.Providers.AzureServiceBus"
            "Centra.Providers.AzureServiceBus.Hosting"
            "Centra.Providers.CosmosDb"
            "Centra.Providers.CosmosDb.Hosting"
            "Centra.Providers.InMemory"
            "Centra.Providers.InMemory.Hosting"
          )

          MISSING=0
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if ! ls ./nupkgs/${pkg}.${{ steps.versioning.outputs.VERSION }}.nupkg 1>/dev/null 2>&1; then
              echo "::error::Missing required package: ${pkg}"
              MISSING=1
            else
              echo "Found package: ${pkg}"
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Package verification failed. Missing required packages."
            exit 1
          fi

      - name: NuGet Login (Trusted Publisher OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ github.repository_owner }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload Package Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ steps.versioning.outputs.VERSION }}
          path: './nupkgs/*.nupkg'
          retention-days: 30