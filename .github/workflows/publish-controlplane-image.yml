name: Publish Control Plane Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g., 1.0.0). Also republished as the floating major.minor tag.'
        required: true
        default: '1.0.0'
        type: string
      push:
        description: 'Push to the registry. Unchecked builds and verifies only.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/centra-controlplane

jobs:
  publish:
    name: Build & Publish Control Plane Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive image tags
        id: tags
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid semantic version."
            exit 1
          fi
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f1-2)"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "MINOR=${MINOR}" >> $GITHUB_OUTPUT
          echo "Publishing ${VERSION} and floating tag ${MINOR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Centra.ControlPlane/Dockerfile
          push: ${{ github.event.inputs.push == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.MINOR }}
          labels: |
            org.opencontainers.image.title=Centra Control Plane
            org.opencontainers.image.description=Centralized component catalog, secret resolution, cluster topology, and real-time streaming sync for Centra.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
