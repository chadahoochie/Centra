name: Publish Control Plane Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version. Must match VersionPrefix in Directory.Build.props (e.g., 1.0.0).'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/centra-controlplane

jobs:
  publish:
    name: Build & Publish Control Plane Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the reference to push is the one the Aspire resource pulls
        id: tags
        env:
          VERSION: ${{ github.event.inputs.version }}
          PUSH_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not a valid semantic version."
            exit 1
          fi

          PREFIX="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          if [ "$VERSION" != "$PREFIX" ]; then
            echo "::error::Version '$VERSION' does not match VersionPrefix '$PREFIX' in Directory.Build.props."
            exit 1
          fi

          # AddCentraControlPlane hardcodes the registry, repository, and tag the resource pulls.
          # Read them back and refuse to publish anything that reference will not resolve to —
          # including a fork pushing under its own owner while consumers still pull chadahoochie/.
          SRC=src/Centra.Aspire.Hosting/CentraAspireExtensions.cs
          PULL_REGISTRY="$(grep -oP '(?<=WithImageRegistry\(")[^"]+' "$SRC")"
          PULL_IMAGE="$(grep -oP '(?<=WithImage\(")[^"]+' "$SRC")"
          PULL_TAG="$(grep -oP 'WithImage\("[^"]+", "\K[^"]+' "$SRC")"
          PULL_REF="${PULL_REGISTRY}/${PULL_IMAGE}:${PULL_TAG}"

          if [ "$PUSH_REF" != "$PULL_REF" ]; then
            echo "::error::Would push '$PUSH_REF' but AddCentraControlPlane pulls '$PULL_REF'."
            exit 1
          fi

          echo "IMAGE_REF=${PUSH_REF}" >> $GITHUB_OUTPUT
          echo "Publishing ${PUSH_REF}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Centra.ControlPlane/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.IMAGE_REF }}
          labels: |
            org.opencontainers.image.title=Centra Control Plane
            org.opencontainers.image.description=Centralized component catalog, secret resolution, cluster topology, and real-time streaming sync for Centra.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
