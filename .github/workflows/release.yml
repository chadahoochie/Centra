name: Release & Publish Packages to NuGet

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to pack and publish (e.g. 1.0.0 or 1.0.0-preview.1)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-packages:
    name: Build, Pack & Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: get_version
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="${{ github.ref_name }}"
          fi

          # Strip leading 'v' if present (e.g., v1.0.0 -> 1.0.0)
          VERSION="${RAW_VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine package version!"
            exit 1
          fi

          echo "Publishing package version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore Centra.slnx

      - name: Build solution
        run: dotnet build Centra.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit test verification
        run: dotnet test Centra.slnx --configuration Release --no-build --filter "Category!=Integration"

      - name: Pack NuGet packages
        run: >-
          dotnet pack Centra.slnx
          --configuration Release
          --no-build
          -p:PackageVersion=${{ steps.get_version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          --output ./dist-packages

      - name: NuGet Login (Trusted Publisher OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER || github.repository_owner }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "./dist-packages/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
